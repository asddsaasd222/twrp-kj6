name: Unpack and Build TWRP for TECNO KJ6

on:
  workflow_dispatch:

jobs:
  unpack_and_prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download vendor_boot.img
        run: |
          wget -O vendor_boot.img https://files.catbox.moe/65c0hx.img

      - name: Download magiskboot & Unpack vendor_boot
        run: |
          wget -O magisk.apk https://github.com
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          mkdir unpacked
          cd unpacked
          ../magiskboot unpack -h ../vendor_boot.img
          ls -la

      - name: Upload Unpacked Files
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-vendor-boot-kj6
          path: unpacked/
