name: Unpack and Build TWRP for TECNO KJ6

on:
  workflow_dispatch:

jobs:
  unpack_and_prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download vendor_boot.img
        run: |
          wget -O vendor_boot.img https://files.catbox.moe/65c0hx.img

      - name: Download official unpack_bootimg & Unpack
        run: |
          wget -O unpack_bootimg.py https://googlesource.com
          base64 -d unpack_bootimg.py > unpack_bootimg
          chmod +x unpack_bootimg
          mkdir unpacked
          python3 unpack_bootimg --boot_img vendor_boot.img --out unpacked
          ls -la unpacked/

      - name: Upload Unpacked Files
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-vendor-boot-kj6
          path: unpacked/
